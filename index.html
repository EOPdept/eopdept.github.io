
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organization Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-container">
    <h1>Organization Portal</h1>
    <p>Sign in with your authorized account.</p>

    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button type="submit">Sign in</button>
<p id="login-message" role="status"></p>

<section id="dashboard" hidden>
  <h2>Organization Dashboard</h2>
  <p>Welcome to the EOP Organization Portal.</p>

  <div class="dashboard-section">
    <h3>ELT Patrol List</h3>
    <p id="patrol-content">No patrol information added yet.</p>
  </div>

  <div class="dashboard-section">
    <h3>Meeting Calendar</h3>
    <p id="calendar-content">No meeting information added yet.</p>
  </div>

  <div class="dashboard-section">
    <h3>Docs &amp; Messages</h3>
    <p id="documents-content">No documents added yet.</p>
  </div>

  <button id="logout-button" type="button">Sign out</button>
</section>
    </form>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
